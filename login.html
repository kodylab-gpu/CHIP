<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Chip AI Atlas</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:420px;background:#121212;border:1px solid #333;border-radius:22px;padding:35px;box-shadow:0 20px 70px #0008}h1{font-size:28px;margin:0 0 12px}p{color:#aaa;font-size:14px;line-height:1.6}input{display:block;width:100%;padding:15px;margin:15px 0;background:#1e1e1e;color:#fff;border:1px solid #444;border-radius:11px;font-size:15px}button{width:100%;padding:15px;background:#fff;color:#000;border:0;border-radius:11px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}a{color:#fff}#status{min-height:20px}.brand{font-weight:bold;letter-spacing:2px;margin-bottom:30px}</style></head><body><main class="card"><div class="brand">◈ CHIP AI ATLAS</div><h1>Welcome back</h1><p>Akkauntingizga kiring.</p><form id="form"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Parol" autocomplete="current-password" required><button id="submit" type="submit">Login</button></form><p id="status" role="status"></p><p>Akkauntingiz yo‘qmi? <a href="/register.html">Register</a></p><p><a href="/">← Asosiy sahifa</a></p></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const form=document.getElementById("form"),status=document.getElementById("status"),button=document.getElementById("submit");try{const r=await fetch("/api/config");if(!r.ok)throw Error("Server konfiguratsiyasi ishlamayapti");const c=await r.json();if(!c.url?.startsWith("https://")||!c.key?.startsWith("sb_publishable_"))throw Error("Supabase sozlamalari noto‘g‘ri");const db=createClient(c.url,c.key);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent="Tekshirilmoqda...";try{const{error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error)throw error;status.textContent="Muvaffaqiyatli kirdingiz!";location.replace("/")}catch(err){status.textContent="Xatolik: "+err.message}finally{button.disabled=false}}}catch(err){status.textContent="Xatolik: "+err.message;button.disabled=true}</script></body></html>
